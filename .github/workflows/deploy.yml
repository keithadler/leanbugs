name: Deploy GitHub Pages

# Adapted from leanprover/lean-eval-leaderboard's deploy.yml: build the Verso site with Lake,
# upload it as a Pages artifact, and deploy it from `main` only. Pull requests run the same build,
# which checks every entry in bugs/ against the schema, but never publish.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# PR builds supersede each other freely. Everything that can publish shares the single
# `github-pages` group and is never cancelled, so a deploy is never lost half-way.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.event.pull_request.number) || 'github-pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout pinned to 3d3c42e5 (= refs/tags/v7.0.1 as of 2026-08-06).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up elan
        shell: bash
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            --fail --silent --show-error --location \
            --retry 5 --retry-all-errors --retry-delay 10 \
            --output "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Configure Pages
        if: github.ref == 'refs/heads/main'
        # actions/configure-pages pinned to 45bfe019 (= refs/tags/v6.0.0 as of 2026-08-06).
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Cache Lake workspace
        # actions/cache pinned to 55cc8345 (= refs/tags/v6.1.0 as of 2026-08-06).
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .lake/packages
            .lake/build
          key: ${{ runner.os }}-lake-${{ hashFiles('lean-toolchain', 'lakefile.lean', 'lake-manifest.json') }}

      - name: Build site generator
        run: lake build

      - name: Check entries and generate site
        run: lake exe leanbugs --output _site

      # Publish only from `main`. A positive ref check rather than "not a PR",
      # so a `workflow_dispatch` aimed at a feature branch cannot publish it.
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        # actions/upload-pages-artifact pinned to fc324d35 (= refs/tags/v5.0.0 as of 2026-08-06).
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # actions/deploy-pages pinned to cd2ce8fc (= refs/tags/v5.0.0 as of 2026-08-06).
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128
